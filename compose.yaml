# ==============================================================================
# AI Evergreen — Docker Compose Specification
# Runs the API Control Plane (FastAPI) and Enterprise React UI (Nginx)
# ==============================================================================

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ai-evergreen-api
    restart: unless-stopped
    ports:
      - "${API_PORT:-8003}:8000"
    environment:
      - PYTHONUNBUFFERED=1
      - METADATA_DB_URL=sqlite:////app/data/metadata.db
      - EVIDENCE_LOCAL_PATH=/app/evidence_store
    env_file:
      - path: .env
        required: false
    volumes:
      - ./data:/app/data
      - ./evidence_store:/app/evidence_store
    command: ["uvicorn", "ai_evergreen.api.main:app", "--host", "0.0.0.0", "--port", "8000"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  ui:
    build:
      context: ./web
      dockerfile: Dockerfile
    container_name: ai-evergreen-ui
    restart: unless-stopped
    ports:
      - "${UI_PORT:-8503}:80"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost/healthz"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    depends_on:
      api:
        condition: service_healthy

volumes:
  data:
  evidence_store:
